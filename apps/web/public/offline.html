<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6ef">
<meta name="robots" content="noindex">
<title>Offline · Kipita</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8f6ef;
    --ink: #112b22;
    --muted: #46564d;
    --green: #174d3b;
    --on-green: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f0d;
      --ink: #faf8f4;
      --muted: #b9bcb6;
      --green: #2f6c4f;
      --on-green: #faf8f4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font: 16px/24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { display: grid; justify-items: center; gap: 12px; max-width: 320px; }
  .mark { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; color: var(--muted); }
  h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    margin-top: 12px;
    padding: 0 28px;
    border-radius: 999px;
    background: var(--green);
    color: var(--on-green);
    font-weight: 700;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="mark">Kipita</span>
  <h1>You're offline</h1>
  <p>Check your signal, then try again.</p>
  <a href="/home">Try again</a>
</main>
</body>
</html>
